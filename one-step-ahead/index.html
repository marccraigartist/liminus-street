<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>One Step Ahead · Marc Craig</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101111; color: #f4f3ee; font: 1rem/1.5 system-ui, sans-serif; }
    main { width: min(100%, 66rem); margin: 0 auto; padding: clamp(1rem, 4vw, 3rem); }
    h1 { font: 400 clamp(2.2rem, 5vw, 4rem)/1.1 Georgia, serif; margin: 0 0 .4rem; }
    p { margin: 0 0 1.25rem; }
    video { display: block; width: 100%; height: auto; aspect-ratio: 1280 / 752; background: #000; }
    figcaption { margin-top: .85rem; color: #d2d2cd; }
    figure { margin: 0; }
    a { color: #f4f3ee; text-underline-offset: .22em; }
    footer { margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>One Step Ahead</h1>
    <p>Marc Craig · Amsterdam Light Festival proposal</p>
    <figure>
      <video controls playsinline preload="metadata" width="1280" height="752" poster="poster.jpg" aria-label="One Step Ahead, a 15-second silent concept film" aria-describedby="description">
        <source src="one-step-ahead.mp4" type="video/mp4">
        <a href="one-step-ahead.mp4">Open the MP4</a>
      </video>
      <figcaption id="description">As the boat passes eight grooved panels, a shadow shows where the next band of colour will appear.</figcaption>
    </figure>
    <footer><a href="one-step-ahead.mp4">Open the MP4</a></footer>
  </main>
</body>
</html>
